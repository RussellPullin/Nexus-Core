<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusCore - Where paperwork disappears</title>
    <style>
      #boot-fallback { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; color: #0f172a; }
      #boot-fallback h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      #boot-fallback p { margin: 0.35rem 0; line-height: 1.45; color: #475569; }
      #boot-fallback button { margin-top: 0.75rem; padding: 0.5rem 0.9rem; font-size: 0.95rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <h1>Loading Nexus Core…</h1>
        <p>If this screen does not change, your browser may have a cached copy from an older deploy.</p>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT') return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div id="boot-fallback">' +
          '<h1>Nexus Core needs a refresh</h1>' +
          '<p>Your browser is using an outdated app file after a recent update.</p>' +
          '<p><strong>Mac:</strong> press Cmd + Shift + R<br><strong>Windows:</strong> press Ctrl + Shift + R</p>' +
          '<button type="button" onclick="location.reload(true)">Reload now</button>' +
          '</div>';
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
